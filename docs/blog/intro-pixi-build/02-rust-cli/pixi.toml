[workspace]
channels = ["https://prefix.dev/conda-forge"]
name = "fibtable"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

# --8<-- [start:dependencies]
[dependencies]
python = ">=3.11"
rich = ">=13"
rust = ">=1.80"            # we now need a Rust toolchain inside the environment
# --8<-- [end:dependencies]

# --8<-- [start:tasks]
[tasks]
# Rebuild the CLI by hand before every run, and remember to do it after every edit.
build-cli = "cargo build --release --manifest-path fib/Cargo.toml"
start = { cmd = "python fibtable.py", depends-on = ["build-cli"] }
# --8<-- [end:tasks]
